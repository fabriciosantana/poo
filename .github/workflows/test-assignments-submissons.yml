name: Test Assignments Submissions

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - 2026.1
    paths:
      - 'assignments/01-programming/**/submissions/**'
  workflow_dispatch:

jobs:
  test-assignments-submissions:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      id: checkout-repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Detect modified task/student pairs
      id: detect-tasks-students
      run: |
        echo "🔍 Verificando os arquivos alterados..."

        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          BASE_REF="${{ github.event.pull_request.base.ref }}"
        else
          BASE_SHA="$(git rev-parse HEAD~1)"
          HEAD_SHA="$(git rev-parse HEAD)"
          BASE_REF="${{ github.ref_name }}"
        fi

        echo "🔎 Base SHA: $BASE_SHA"
        echo "🔎 Head SHA: $HEAD_SHA"

        git fetch --no-tags --prune --depth=1 origin "$BASE_REF"

        MODIFIED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

        # Extrai pares únicos de tarefa/aluno no formato "task|student"
        PAIRS_FILE="changed-submission-pairs.txt"
        echo "$MODIFIED_FILES" \
          | awk -F/ '/^assignments\/01-programming\/.*\/submissions\/[^\/]+\// {
              submission_idx=0
              student=""
              for (j=1; j<=NF; j++) {
                if ($j == "submissions") {
                  submission_idx=j
                  student=$(j+1)
                  break
                }
              }
              task=""
              for (i=2; i<submission_idx; i++) {
                task = task (i==2 ? "" : "/") $i
              }
              if (submission_idx > 0 && task != "" && student != "") print task "|" student
            }' \
          | sort -u > "$PAIRS_FILE"

        if [ ! -s "$PAIRS_FILE" ]; then
          echo "❌ Erro: Nenhuma alteração detectada em assignments/01-programming/**/submissions/**"
          exit 1
        fi

        echo "📦 Submissões alteradas:"
        cat "$PAIRS_FILE"

    - name: Set up JDK 21
      uses: actions/setup-java@v2
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Download JUnit dependency
      id: download-junit
      run: |
        echo "⬇️ Baixando JUnit..."
        mkdir -p test-libs
        curl -L -o test-libs/junit-platform-console-standalone-1.11.4.jar \
          https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.11.4/junit-platform-console-standalone-1.11.4.jar

    - name: Execute tests for modified submissions
      run: |
        echo "🚀 Iniciando testes para as tarefas alteradas..."
        TEST_FAILURES=0

        if [ ! -s changed-submission-pairs.txt ]; then
          echo "❌ Arquivo de pares alterados não encontrado."
          exit 1
        fi

        while IFS='|' read -r task student; do
          [ -z "$task" ] && continue
          [ -z "$student" ] && continue

          echo "🔍 Testando: Tarefa '$task' | Aluno '$student'"

          # Diretórios relevantes
          TASK_DIR="assignments/$task"
          STUDENT_DIR="$TASK_DIR/submissions/$student"
          CODE_DIR="$STUDENT_DIR/src"
          BIN_DIR="$STUDENT_DIR/bin"

          if [ -d "$TASK_DIR/test" ]; then
            TEST_DIR="$TASK_DIR/test"
          elif [ -d "$TASK_DIR/tests" ]; then
            TEST_DIR="$TASK_DIR/tests"
          else
            TEST_DIR=""
          fi

          # Valida se os diretórios existem
          if [ ! -d "$TASK_DIR" ]; then
            echo "⚠️  Diretório da tarefa '$TASK_DIR' não encontrado. Pulando..."
            continue
          fi

          if [ ! -d "$STUDENT_DIR" ]; then
            echo "⚠️  Diretório do aluno '$STUDENT_DIR' não encontrado. Pulando..."
            continue
          fi

          if [ ! -d "$CODE_DIR" ]; then
            echo "⚠️  Nenhum código encontrado em '$CODE_DIR'. Pulando..."
            continue
          fi

          if [ -z "$TEST_DIR" ]; then
            echo "⚠️  Nenhum diretório de testes encontrado em '$TASK_DIR/test' ou '$TASK_DIR/tests'. Pulando..."
            continue
          fi

          mapfile -t CODE_FILES < <(find "$CODE_DIR" -type f -name "*.java" | sort)
          mapfile -t TEST_FILES < <(find "$TEST_DIR" -type f -name "*.java" | sort)

          if [ ${#CODE_FILES[@]} -eq 0 ]; then
            echo "⚠️  Nenhum arquivo .java encontrado em '$CODE_DIR'. Pulando..."
            continue
          fi

          if [ ${#TEST_FILES[@]} -eq 0 ]; then
            echo "⚠️  Nenhum arquivo de teste .java encontrado em '$TEST_DIR'. Pulando..."
            continue
          fi

          rm -rf "$BIN_DIR"
          mkdir -p "$BIN_DIR"

          # Compila os arquivos Java
          echo "⚙️ Compilando código..."
          if ! javac -cp "test-libs/junit-platform-console-standalone-1.11.4.jar" -d "$BIN_DIR" "${CODE_FILES[@]}" "${TEST_FILES[@]}"; then
            echo "❌ Erro na compilação do aluno '$student' na tarefa '$task'"
            TEST_FAILURES=$((TEST_FAILURES + 1))
            continue
          fi

          # Executa os testes
          echo "🧪 Executando testes..."
          if ! java -jar "test-libs/junit-platform-console-standalone-1.11.4.jar" execute --class-path "$BIN_DIR" --scan-class-path; then
            echo "❌ Falha nos testes para aluno '$student' na tarefa '$task'"
            TEST_FAILURES=$((TEST_FAILURES + 1))
            continue
          fi

          echo "✅ Testes bem-sucedidos para '$student' na tarefa '$task'!"
        done < changed-submission-pairs.txt

        if [ $TEST_FAILURES -gt 0 ]; then
          echo "❌ $TEST_FAILURES falha(s) nos testes. Verifique os logs!"
          exit 1
        fi

    - name: Cleanup temporary files
      run: rm -rf test-libs changed-submission-pairs.txt
